[project]
name = "groundtruth"
version = "0.1.0"
description = "Three-tier grounded cognitive agent with auditable belief revision."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "networkx>=3.3",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
#export [$PYTEST_DISABLE_PLUGIN_AUTOLOAD=1] if it shows ROS plugin error

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
