[project]
name = "groundtruth"
version = "0.1.0"
description = "Three-tier grounded cognitive agent with auditable belief revision."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["src/declaritive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
